<div class="signup-page">
  <div class="glass-card">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>

    <h2>Create Account</h2>
    <p>Join us and start your e-book journey</p>

    <form (ngSubmit)="register()" autocomplete="off" novalidate>
      <div class="input-box">
        <span class="icon">👤</span>
        <input type="text" name="username" [(ngModel)]="username" placeholder="Username" required />
      </div>

      <div class="input-box">
        <span class="icon">✉</span>
        <input type="email" name="email" [(ngModel)]="email" placeholder="Email" required />
      </div>

      <div class="input-box">
        <span class="icon">🔒</span>
        <input type="password" name="password" [(ngModel)]="password" placeholder="Password" required />
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Signing Up...' : 'Sign Up' }}
      </button>
    </form>

    <div class="message error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="message success" *ngIf="successMessage">{{ successMessage }}</div>

    <div class="footer-link">
      <span>Already have an account?</span>
      <a [routerLink]="['/auth/login']">Sign in</a>
    </div>
  </div>
</div>
